version: "3.8"
services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # Tenant subdomains are generated under this base domain and it also
      # feeds config('tenancy.central_domains'). MUST be a bare host.
      - CENTRAL_DOMAIN=${CENTRAL_DOMAIN:-superx-erp.com}
      # Empty in production: store/activation/login URLs are then derived from
      # CENTRAL_DOMAIN over https. Set it locally to enable {sub}.localhost URLs.
      - SUPERX_FRONTEND_URL=${SUPERX_FRONTEND_URL:-}
      - SUPERX_TENANT_DEV_SUBDOMAINS=${SUPERX_TENANT_DEV_SUBDOMAINS:-false}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "https://superx-erp.com/api/v1"
        # Lets the login page recognise a tenant host ({sub}.{base}) and run
        # tenant-domain login instead of the owner-only central login.
        NEXT_PUBLIC_SUPERX_BASE_DOMAIN: "${CENTRAL_DOMAIN:-superx-erp.com}"
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://superx-erp.com/api/v1
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  postgres_data: